<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>전지 연구실 3D</title>
<style>
:root{--bg:#eef4fb;--card:#ffffff;--tx:#1c2a44;--mut:#5b6b8c;--ok:#16a34a;--bad:#dc2626;--ac:#d97706;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.w{max-width:1000px;margin:0 auto;padding:10px}
#stage{border-radius:14px;overflow:hidden;position:relative;background:#d6e6f8;box-shadow:0 6px 24px rgba(60,90,140,.18)}
#stage canvas{display:block;width:100%}
#hint{position:absolute;left:0;right:0;top:12px;text-align:center;color:#3b4a6b;font-size:14px;pointer-events:none}
.shelf{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{padding:10px 14px;border-radius:8px;color:#111;font-weight:700;cursor:grab;user-select:none;min-width:34px;text-align:center;box-shadow:0 2px 0 rgba(0,0,0,.4)}
.chip small{display:block;font-weight:500;font-size:10px;opacity:.7}
.card{background:var(--card);border-radius:12px;padding:12px;margin-top:10px;font-size:14px;line-height:1.7}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button,select{background:#dbe6f7;color:var(--tx);border:0;border-radius:8px;padding:8px 14px;font-size:14px;cursor:pointer}
input[type=range]{flex:1;min-width:140px}
.big{font-size:22px;font-weight:700;color:var(--ac)}
table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:4px 6px;border-bottom:1px solid #dde6f3;text-align:left}
.p{color:var(--ok);font-weight:700}.f{color:var(--bad);font-weight:700}.sc{overflow-x:auto}
h3{margin:0 0 2px;font-size:16px}.sub{color:var(--mut);font-size:12px}
.empty{padding:14px;text-align:center;color:var(--mut);background:#f4f8fd;border-radius:10px}.empty.bad{color:var(--bad);font-weight:700}
.formula{font-size:13px;color:var(--mut);margin-bottom:8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.tile{background:#f4f8fd;border-radius:10px;padding:10px 12px}.tile span{display:block;font-size:12px;color:var(--mut)}.tile b{font-size:21px}
.tile.hl{background:#fff4d6}.tile.hl b{color:#d97706}
.warn{margin-top:8px;padding:8px 12px;border-radius:8px;background:#fee2e2;color:#b91c1c;font-size:13px;font-weight:600}
.conc{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.conc div{position:relative;background:#f4f8fd;border-radius:8px;padding:7px 10px 10px;font-size:13px;overflow:hidden}
.conc i{position:absolute;left:0;bottom:0;height:5px;background:#60a5fa;border-radius:3px}
.devs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.dv{padding:6px 10px;border-radius:999px;background:#eef1f6;color:#8b97b0;font-size:13px;font-weight:600}.dv small{font-weight:500}
.dv.on{background:#dcfce7;color:#15803d}
button.tg{background:#dcfce7;color:#15803d;font-weight:700}button.tg.off{background:#fee2e2;color:#b91c1c}
.tab{font-weight:700}.tab.on{background:#2563eb;color:#fff}.not{font-size:16px;font-weight:700;background:#eef4ff;border-radius:8px;padding:8px 12px;margin-bottom:8px;overflow-x:auto;white-space:nowrap}
.grp{padding:10px 0;border-top:1px solid #e3ebf6}.grp:first-child{border-top:0;padding-top:0}.grp>b{display:block;font-size:13px;color:var(--mut);margin-bottom:8px}.ctl button{min-height:38px}
#stage{height:clamp(300px,52vh,440px)}.w{max-width:880px}#hint{right:165px}
#side{position:absolute;top:10px;right:10px;width:148px;max-height:calc(100% - 20px);overflow-y:auto;background:rgba(255,255,255,.9);backdrop-filter:blur(6px);border-radius:12px;box-shadow:0 4px 16px rgba(30,50,90,.22);padding:6px;z-index:5;display:flex;flex-direction:column;gap:5px}
#side.min{width:auto}#side.min .sbody{display:none}
#side button,#side select{width:100%;text-align:left;padding:7px 9px;min-height:0;font-size:13px;white-space:nowrap}
#side .sbody,#pgrp,#devbtn{display:flex;flex-direction:column;gap:5px}
#side h4{margin:6px 2px 0;font-size:11px;color:var(--mut)}
#tbar{position:absolute;left:12px;right:172px;bottom:10px;display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.85);border-radius:10px;padding:6px 10px;font-size:11px;color:var(--mut);z-index:4}
#rate{white-space:nowrap}
@media(max-width:600px){#rate{display:none}#tbar{right:10px}#hint{right:0;font-size:12px}}
#gcard{position:absolute;top:10px;left:10px;width:230px;background:rgba(255,255,255,.88);backdrop-filter:blur(6px);border-radius:12px;box-shadow:0 4px 16px rgba(30,50,90,.22);padding:4px;z-index:4;pointer-events:none}
#gr{display:block;width:100%;height:auto}#hint{left:245px}
@media(max-width:600px){#gcard{width:150px}#hint{display:none}}
#intro{position:fixed;inset:0;z-index:100;background:#000;color:#fff;overflow:hidden;transition:background 1.4s,opacity .9s,backdrop-filter 1.4s,transform .9s}
#intro canvas{position:absolute;inset:0;width:100%;height:100%}
#itext{position:absolute;left:0;right:0;bottom:11vh;text-align:center;padding:0 5vw;pointer-events:none}
.s7 #itext{bottom:27vh}
.il{font-size:clamp(16px,2.5vw,27px);line-height:1.75;opacity:0;text-shadow:0 2px 14px #000;font-weight:500}
.il.big{font-size:clamp(24px,4vw,44px);font-weight:800;color:#ffd666}
#iskip{position:absolute;top:14px;right:16px;background:rgba(255,255,255,.13);color:#fff;font-size:12px;padding:6px 13px;border-radius:999px;opacity:.8;z-index:3}
#istart{position:absolute;left:50%;bottom:12vh;transform:translateX(-50%);padding:14px 50px;font-size:22px;font-weight:800;letter-spacing:.22em;background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#2b1a00;border-radius:999px;display:none;animation:pls 1.6s infinite;z-index:3}
@keyframes pls{0%,100%{box-shadow:0 0 26px rgba(251,191,36,.55)}50%{box-shadow:0 0 56px rgba(251,191,36,.95)}}
#isub{position:absolute;left:0;right:0;bottom:6.5vh;text-align:center;opacity:0;transition:opacity 1s;font-size:14px;color:#cbd5e1}
#ihint{position:absolute;left:0;right:0;bottom:2.5vh;text-align:center;font-size:12px;color:#64748b;pointer-events:none}
#tut{position:fixed;inset:0;z-index:90;display:none}
#tspot{position:fixed;border-radius:12px;box-shadow:0 0 0 9999px rgba(8,14,30,.68),0 0 0 3px #fbbf24,0 0 24px 4px rgba(251,191,36,.6);transition:all .35s;pointer-events:none}
#ttip{position:fixed;background:#fff;color:#1c2a44;border-radius:14px;padding:14px 16px;box-shadow:0 10px 36px rgba(0,0,0,.35);line-height:1.6;font-size:14px;transition:top .3s,left .3s}
#tstep{font-size:11px;color:#d97706;font-weight:800}#ttitle{font-size:16px;font-weight:800;margin:2px 0 4px}
#tbtn{display:flex;justify-content:space-between;margin-top:10px}#tbtn button{padding:7px 12px;font-size:13px}#tnext{background:#2563eb;color:#fff;font-weight:700}
</style></head><body><div class="w">
<div class="row" id="tabs" style="margin-bottom:8px"><button class="tab" data-m="volta">① 볼타전지</button><button class="tab" data-m="daniell">② 다니엘전지</button><button class="tab" data-m="fruit">③ 과일전지</button></div>
<div id="stage"><div id="hint">금속을 끌어다 화면 왼쪽/오른쪽에 놓으세요 · 마우스로 회전·확대</div><div id="side"><button id="sbt">☰ 메뉴</button><div class="sbody">
<div id="pgrp"><h4>재생</h4><button id="pl">▶ 재생</button><button id="rs">↺ 리셋</button><select id="sp"><option value="1">⏩ 1배속</option><option value="2">⏩ 2배속</option><option value="5">⏩ 5배속</option></select></div>
<h4>회로</h4><button id="bd" class="tg">🧂 염다리 ON</button><button id="vm" class="tg">📏 전압계 연결</button><button id="sn">🔊 소리 ON</button>
<h4>부하 장치</h4><div id="devbtn"></div><h4>도움말</h4><button id="help">❓ 사용법</button></div></div>
<div id="gcard"><canvas id="gr" width="360" height="200"></canvas></div>
<div id="tbar"><input type="range" id="tm" min="0" max="1000" value="0"><span id="rate"></span></div></div>
<div class="card"><b>① 금속 고르기</b> <span class="sub">클릭하면 순서대로 들어가고, 화면으로 끌어다 놓아도 돼요 · 더블클릭: 빼기</span><div class="shelf" id="shelf"></div></div>
<div class="card" id="fruitbar" style="display:none"><b>② 과일 고르기</b><div class="shelf" id="fruits"></div><div class="row" style="margin-top:10px"><label>과일 개수 (직렬연결) <input type="range" id="nfr" min="1" max="6" value="3"></label><b id="nfv">3개</b></div></div>
<div class="card"><div id="info"></div><div style="margin-top:8px"><button id="goD" style="display:none;background:#fde68a;font-weight:700">다니엘전지로 가기 ▶</button></div></div>

</div>
<div id="intro"><canvas id="ic"></canvas><div id="itext"></div><button id="iskip">SKIP ▸▸</button><button id="istart">START</button><div id="isub">직접 만들어 보고, 직접 확인해 봅시다.</div><div id="ihint">화면을 클릭하면 다음 장면으로 넘어가요</div></div>
<div id="tut"><div id="tspot"></div><div id="ttip"><div id="tstep"></div><div id="ttitle"></div><div id="ttext"></div><div id="tbtn"><button id="tskip">건너뛰기</button><span><button id="tprev">◀ 이전</button> <button id="tnext">다음 ▶</button></span></div></div></div>
